<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2A6BE0}a:hover{color:#1F55B8}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F3F7; font-family: Inter, system-ui, sans-serif; color: #15171C">
<main style="position: absolute; top: 0; left: 0; right: 0; bottom: 84px; overflow-y: auto; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 18px">

<header>
<h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Настройки</h1>
</header>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6573">{{g.title}}</h2>
<div style="background: #FFFFFF; border-radius: 18px; display: flex; flex-direction: column">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div style="{{r.rowStyle}}">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 15px; font-weight: 500">{{r.label}}</span><sc-if value="{{r.hasHint}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5F6573">{{r.hint}}</span></sc-if></div>
<sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ false }}">
<button role="switch" aria-checked="{{r.checked}}" aria-label="{{r.label}}" onClick="{{r.toggle}}" style="{{r.track}}"><span style="{{r.knob}}"></span></button>
</sc-if>
<sc-if value="{{r.isValue}}" hint-placeholder-val="{{ true }}">
<button aria-label="{{r.aria}}" style="height: 44px; border: none; background: transparent; padding: 0 0 0 8px; display: flex; align-items: center; gap: 4px; font-size: 14px; color: #5F6573; cursor: pointer">{{r.value}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA0AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</sc-if>
</div>
</sc-for>
</div>
</section>
</sc-for>

</main>

<nav aria-label="Основная навигация" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 22px; background: #FFFFFF; border-top: 1px solid #E4E6EC; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5F6573; font-size: 11px; font-weight: 500">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Календарь</a>
<a href="Bookings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5F6573; font-size: 11px; font-weight: 500">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 3h6v3H9zM9 11h6M9 15h4"></path></svg><span style="position: absolute; top: 0; right: 10px; min-width: 16px; height: 16px; border-radius: 999px; background: #D9480F; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span></span>Записи</a>
<a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5F6573; font-size: 11px; font-weight: 500">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path></svg></span>Профиль</a>
<a href="Settings.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 600">
<span style="width: 56px; height: 30px; border-radius: 999px; background: {{accentSoft}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg></span>Настройки</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2A6BE0","options":["#2A6BE0","#7C3AED","#0F766E","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { auto: false, dayBefore: true, sameDay: true, confirmMsg: true, newBooking: true };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2A6BE0';
    const v = (label, value, hint) => ({ label, value, hint: hint || '', type: 'v' });
    const t = (label, key, hint) => ({ label, key, hint: hint || '', type: 't' });
    const raw = [
      { title: 'Расписание', rows: [
        v('Рабочие дни', 'Пн–Сб'),
        v('Часы работы', '10:00–20:00'),
        v('Перерыв между окнами', '15 мин'),
        v('Открывать запись', 'на 2 недели')
      ]},
      { title: 'Подтверждение записи', rows: [
        t('Автоподтверждение', 'auto', 'Окно сразу станет «Занято»'),
        v('Срок на подтверждение', '24 ч', 'Потом заявка отменится')
      ]},
      { title: 'Напоминания клиенту', rows: [
        t('Запись подтверждена', 'confirmMsg', 'Сообщение от бота сразу'),
        t('За день до записи', 'dayBefore', 'В 18:00'),
        t('В день записи', 'sameDay', 'За 2 часа')
      ]},
      { title: 'Уведомления мне', rows: [
        t('Новая заявка', 'newBooking')
      ]},
      { title: 'Аккаунт', rows: [
        v('Язык', 'Русский'),
        v('Поддержка', '')
      ]}
    ];
    const groups = raw.map(g => ({
      title: g.title,
      rows: g.rows.map((r, i) => {
        const on = r.type === 't' ? !!this.state[r.key] : false;
        return {
          label: r.label, hint: r.hint, hasHint: !!r.hint, value: r.value || '',
          aria: r.label + (r.value ? ': ' + r.value : ''),
          isToggle: r.type === 't', isValue: r.type === 'v',
          checked: on ? 'true' : 'false',
          toggle: () => this.setState({ [r.key]: !this.state[r.key] }),
          rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 16px; min-height: 52px; box-sizing: border-box;' + (i > 0 ? ' border-top: 1px solid #EEF0F4;' : ''),
          track: 'width: 52px; height: 32px; flex-shrink: 0; border: none; border-radius: 999px; padding: 3px; cursor: pointer; display: flex; transition: background 0.15s; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? accent : '#C9CDD6') + ';',
          knob: 'width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(20,23,28,0.2);'
        };
      })
    }));
    return { accent, accentSoft: accent + '1F', groups };
  }
}
</script>
</body>
</html>
